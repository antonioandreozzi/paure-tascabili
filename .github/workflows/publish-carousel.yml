name: Pubblica Carosello su Meta

on:
  push:
    branches: [main]
    paths:
      - 'content/carousels/**.json'
      - '!content/carousels/used-hooks.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Installa dipendenze Python
        run: pip install pillow requests -q

      - name: Trova caroselli nuovi
        id: find
        run: |
          NEW_JSON=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'content/carousels/*.json' | grep -v used-hooks.json || true)
          echo "files=$NEW_JSON" >> "$GITHUB_OUTPUT"
          if [ -z "$NEW_JSON" ]; then
            echo "Nessun nuovo carosello JSON trovato."
          else
            echo "Caroselli da pubblicare: $NEW_JSON"
          fi

      - name: Genera immagini e pubblica su Facebook
        if: steps.find.outputs.files != ''
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: "680037628515928"
          GITHUB_RAW_BASE: "https://raw.githubusercontent.com/antonioandreozzi/paure-tascabili/main"
          PUBLISH_MODE: "fb-only"
        run: |
          for f in ${{ steps.find.outputs.files }}; do
            echo "Pubblicazione FB: $f"
            python scripts/publish_to_meta.py "$f"
          done

      - name: Commit e push immagini su GitHub
        if: steps.find.outputs.files != ''
        run: |
          git config user.name "Carousel Publisher"
          git config user.email "carousel@pauretascabili.it"
          git add public/carousels/ content/carousels/*.publish_log.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Immagini carosello 4:5 generate da GitHub Actions"
          git push origin main || true

      - name: Attendi propagazione GitHub CDN (15 secondi)
        if: steps.find.outputs.files != ''
        run: sleep 15

      - name: Pubblica su Instagram e Threads (usando URL GitHub già aggiornati)
        if: steps.find.outputs.files != ''
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: "680037628515928"
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GITHUB_RAW_BASE: "https://raw.githubusercontent.com/antonioandreozzi/paure-tascabili/main"
          PUBLISH_MODE: "ig-only"
        run: |
          for f in ${{ steps.find.outputs.files }}; do
            echo "Pubblicazione IG: $f"
            python scripts/publish_to_meta.py "$f"
          done

      - name: Aggiorna log con IG post ID
        if: steps.find.outputs.files != ''
        run: |
          git config user.name "Carousel Publisher"
          git config user.email "carousel@pauretascabili.it"
          git add content/carousels/*.publish_log.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Log aggiornato con IG post ID"
          git push origin main || true

name: Pubblica Stories su Meta

on:
  push:
    branches: [main]
    paths:
      - 'content/stories/**.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Installa dipendenze Python
        run: pip install pillow requests -q

      - name: Trova story JSON nuovi
        id: find
        run: |
          NEW_JSON=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'content/stories/*.json' || true)
          echo "files=$NEW_JSON" >> "$GITHUB_OUTPUT"
          if [ -z "$NEW_JSON" ]; then
            echo "Nessuna nuova Story trovata."
          else
            echo "Stories da pubblicare: $NEW_JSON"
          fi

      - name: Genera e pubblica Stories (FB + IG)
        if: steps.find.outputs.files != ''
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: "680037628515928"
          PYTHONIOENCODING: "utf-8"
        run: |
          LOG_OUT="content/stories/debug_last_run.txt"
          echo "=== Run $(date -u) ===" > "$LOG_OUT"
          echo "Files: ${{ steps.find.outputs.files }}" >> "$LOG_OUT"
          for f in ${{ steps.find.outputs.files }}; do
            echo "" >> "$LOG_OUT"
            echo "--- $f ---" >> "$LOG_OUT"
            python scripts/publish_stories.py "$f" >> "$LOG_OUT" 2>&1
            echo "EXIT: $?" >> "$LOG_OUT"
            LOG_FILE="${f%.json}.publish_log.json"
            if [ -f "$LOG_FILE" ]; then
              echo "LOG_TROVATO: $LOG_FILE" >> "$LOG_OUT"
              cat "$LOG_FILE" >> "$LOG_OUT"
            else
              echo "LOG_NON_TROVATO: $LOG_FILE" >> "$LOG_OUT"
            fi
          done
          cat "$LOG_OUT"

      - name: Commit log pubblicazione
        if: steps.find.outputs.files != ''
        run: |
          git config user.name "Stories Publisher"
          git config user.email "stories@pauretascabili.it"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add content/stories/debug_last_run.txt
          find content/stories -name "*.publish_log.json" -exec git add {} \;
          git status --short
          git diff --staged --quiet || git commit -m "Log Stories pubblicate $(date +%Y-%m-%d)"
          git push origin main 2>&1

name: Pubblica Stories su Meta

on:
  push:
    branches: [main]
    paths:
      - 'content/stories/**.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Installa dipendenze Python
        run: pip install pillow requests -q

      - name: Trova story JSON nuovi
        id: find
        run: |
          NEW_JSON=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'content/stories/*.json' || true)
          echo "files=$NEW_JSON" >> "$GITHUB_OUTPUT"
          if [ -z "$NEW_JSON" ]; then
            echo "Nessuna nuova Story trovata."
          else
            echo "Stories da pubblicare: $NEW_JSON"
          fi

      - name: Genera e pubblica Stories (FB + IG)
        if: steps.find.outputs.files != ''
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: "680037628515928"
          PYTHONIOENCODING: "utf-8"
        run: |
          for f in ${{ steps.find.outputs.files }}; do
            echo "=== Pubblicazione: $f ==="
            python scripts/publish_stories.py "$f"
            echo "Exit: $?"
          done

      - name: Commit log pubblicazione
        if: steps.find.outputs.files != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== CWD: $(pwd) ==="
          echo "=== ls content/stories/ ==="
          ls -la content/stories/
          git config user.name "Stories Publisher"
          git config user.email "stories@pauretascabili.it"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git status
          git add content/stories/
          git status
          git diff --staged --quiet || git commit -m "Log Stories pubblicate $(date +%Y-%m-%d)"
          git push origin main
